name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.suffix }} DMG
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            suffix: arm64
          - runner: macos-15-intel
            arch: x86_64
            suffix: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer
          xcodebuild -version

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Agent Host dependencies
        working-directory: AgentHost
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org

      - name: Validate tag version
        run: |
          PROJECT_VERSION="$(awk '$1 == "MARKETING_VERSION:" { print $2; exit }' project.yml)"
          if [ -z "$PROJECT_VERSION" ]; then
            echo "::error::MARKETING_VERSION is missing from project.yml"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "v$PROJECT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version v$PROJECT_VERSION"
            exit 1
          fi
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"

      - name: Check Agent Host and runtime recovery
        run: |
          (cd AgentHost && bun run typecheck && bun test)
          python3 -m unittest scripts/test_agent_runtime_package.py scripts/test_release_workflow.py
          bash scripts/test-agent-runtime.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run application tests
        run: |
          xcodebuild test \
            -project pi-work.xcodeproj \
            -scheme PiWork \
            -configuration Debug \
            -destination "platform=macOS,arch=${{ matrix.arch }}" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PiWorkTests.xcresult" \
            ARCHS="${{ matrix.arch }}" ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=""
          rm -rf "$RUNNER_TEMP/TestDerivedData"

      - name: Upload application test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PiWorkTests-${{ matrix.suffix }}
          path: ${{ runner.temp }}/PiWorkTests.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Build archive
        run: |
          archive_path="$RUNNER_TEMP/PiWork-${{ matrix.suffix }}.xcarchive"
          derived_data_path="$RUNNER_TEMP/DerivedData-${{ matrix.suffix }}"
          xcodebuild \
            -project pi-work.xcodeproj \
            -scheme PiWork \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$archive_path" \
            -derivedDataPath "$derived_data_path" \
            ARCHS="${{ matrix.arch }}" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$PROJECT_VERSION" \
            archive
          echo "ARCHIVE_PATH=$archive_path" >> "$GITHUB_ENV"
          echo "DERIVED_DATA_PATH=$derived_data_path" >> "$GITHUB_ENV"

      - name: Apply ad-hoc application signature
        run: |
          app_path="$ARCHIVE_PATH/Products/Applications/PiWork.app"
          # Preserve the helper's staged identity and hardened-runtime flags:
          # changing them here invalidates existing macOS privacy grants.
          codesign --force --deep --preserve-metadata=entitlements,flags,runtime --sign - "$app_path"
          echo "APP_PATH=$app_path" >> "$GITHUB_ENV"

      - name: Verify application
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          actual_arch="$(lipo -archs "$APP_PATH/Contents/MacOS/PiWork")"
          if [ "$actual_arch" != "${{ matrix.arch }}" ]; then
            echo "::error::Expected ${{ matrix.arch }} executable, found $actual_arch"
            exit 1
          fi

      - name: Reclaim build storage
        run: |
          rm -rf "$DERIVED_DATA_PATH"
          df -h "$RUNNER_TEMP"

      - name: Create ad-hoc signed DMG
        run: |
          app_path="$APP_PATH"
          staging_path="$RUNNER_TEMP/dmg-${{ matrix.suffix }}"
          dmg_path="$RUNNER_TEMP/PiWork-${PROJECT_VERSION}-macos-${{ matrix.suffix }}.dmg"

          mkdir -p "$staging_path"
          mv "$app_path" "$staging_path/PiWork.app"
          rm -rf "$ARCHIVE_PATH"
          ln -s /Applications "$staging_path/Applications"
          staging_size_mb="$(du -sm "$staging_path" | awk '{ print $1 }')"
          dmg_size_mb="$((staging_size_mb + 256))"
          hdiutil create \
            -volname "PiWork $PROJECT_VERSION" \
            -srcfolder "$staging_path" \
            -size "${dmg_size_mb}m" \
            -format UDZO \
            -ov \
            "$dmg_path"
          codesign --force --sign - "$dmg_path"
          codesign --verify --verbose=2 "$dmg_path"
          echo "DMG_PATH=$dmg_path" >> "$GITHUB_ENV"

      - name: Stage release artifact
        run: |
          mkdir -p dist
          mv "$DMG_PATH" dist/

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiWork-${{ matrix.suffix }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download DMG artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PiWork-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./*.dmg > SHA256SUMS.txt

      - name: Write release notes
        run: |
          printf '%s\n' \
            '> **Warning:** These builds are ad-hoc signed and are not notarized by Apple. macOS will show a Gatekeeper warning on first launch.' \
            '' \
            'This release contains separate native builds for Apple Silicon and Intel Macs. Verify downloads with SHA256SUMS.txt.' \
            > dist/RELEASE_NOTES.md
          notes_path="docs/releases/${GITHUB_REF_NAME#v}.md"
          if [ -f "$notes_path" ]; then
            printf '\n' >> dist/RELEASE_NOTES.md
            cat "$notes_path" >> dist/RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.dmg \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --notes-file dist/RELEASE_NOTES.md \
            --title "PiWork $GITHUB_REF_NAME"
