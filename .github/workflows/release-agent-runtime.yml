name: Release Agent Runtime

on:
  workflow_dispatch:
  push:
    tags:
      - "runtime-v*"

# Serialize channel publication, including across different runtime tags.
concurrency:
  group: agent-runtime-stable
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Validate runtime tag
        run: |
          version="$(bun -e 'console.log(require("./AgentHost/package.json").piWorkRuntime.version)')"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_REF_NAME" = "runtime-v$version"
          fi
      - name: Install locked SDK dependencies
        working-directory: AgentHost
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Check adapter types and interactions
        working-directory: AgentHost
        run: |
          bun run typecheck
          bun test
      - name: Check runtime installer and recovery
        run: |
          python3 -m unittest scripts/test_agent_runtime_package.py
          bash scripts/test-agent-runtime.sh
      - name: Build standalone runtime
        run: python3 scripts/package-agent-runtime.py --architecture "${{ matrix.architecture }}" --output dist
      - name: Smoke test packaged runtime
        run: bash scripts/test-agent-runtime.sh dist/runtime-${{ matrix.architecture }}.json
      - name: Verify packaged image support without build dependencies
        run: |
          smoke_dir="$(mktemp -d)"
          tar -xzf dist/PiWorkRuntime-*.tar.gz -C "$smoke_dir"
          mv AgentHost/node_modules "$RUNNER_TEMP/image-smoke-node_modules"
          trap 'mv "$RUNNER_TEMP/image-smoke-node_modules" AgentHost/node_modules; rm -rf "$smoke_dir"' EXIT
          "$smoke_dir/bun" scripts/test-runtime-images.ts "$smoke_dir/pi-work-agent-host"
      - uses: actions/upload-artifact@v4
        with:
          name: AgentRuntime-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/runtime-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: AgentRuntime-*
          path: dist
          merge-multiple: true
      - name: Read the existing stable channel
        run: |
          mkdir previous
          status="$(curl --silent --show-error --retry 3 --output previous/channel.json \
            --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GH_REPO/releases/tags/agent-runtime-stable")"
          case "$status" in
            200)
              if jq -e '.assets | any(.name == "runtime-index.json")' previous/channel.json >/dev/null; then
                gh release download agent-runtime-stable --pattern runtime-index.json --dir previous
              fi
              ;;
            404) ;;
            *) echo "Cannot read runtime channel (HTTP $status)" >&2; exit 1 ;;
          esac
      - name: Build compatible runtime history
        run: python3 scripts/publish-agent-runtime-index.py --artifacts dist --previous previous/runtime-index.json
      - name: Publish immutable version and update channel
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            mkdir published
            gh release download "$GITHUB_REF_NAME" --pattern 'runtime-*.json' --dir published
            cmp dist/runtime-arm64.json published/runtime-arm64.json
            cmp dist/runtime-x86_64.json published/runtime-x86_64.json
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/runtime-*.json \
              --verify-tag --latest=false --title "PiWork Agent Runtime $GITHUB_REF_NAME" \
              --notes "Independent PiWork Agent Host packages. Install from PiWork Settings."
          fi
          if ! gh release view agent-runtime-stable >/dev/null 2>&1; then
            gh release create agent-runtime-stable --target "$GITHUB_SHA" --latest=false \
              --title "PiWork Agent Runtime Stable Channel" \
              --notes "Runtime update index consumed by PiWork. App releases are published separately."
          fi
          gh release upload agent-runtime-stable dist/runtime-index.json --clobber
