name: pi-work
options:
  bundleIdPrefix: cc.vibevibe
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    MACOSX_DEPLOYMENT_TARGET: "13.0"
  configs:
    Debug:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
      PROVISIONING_PROFILE_SPECIFIER: ""
      ENABLE_HARDENED_RUNTIME: NO
      ENABLE_TESTABILITY: YES
    Release:
      # Distribution builds should use a real Developer ID team so the app
      # can be notarized. Override DEVELOPMENT_TEAM for CI/release builds.
      CODE_SIGN_STYLE: Automatic
      ENABLE_HARDENED_RUNTIME: YES

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1

targets:
  PiWork:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    dependencies:
      - package: MarkdownUI
    sources:
      - path: PiWork
        excludes:
          - "Resources/PiAgent/**"
    resources:
      - path: PiWork/Resources
        excludes:
          - "PiAgent/**"
    info:
      path: PiWork/Resources/Info.plist
      properties:
        CFBundleDisplayName: pi-work
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # Must be a string: CFNetwork builds the default User-Agent from this
        # and calls -length on it, so a numeric value crashes on the first
        # URLSession request.
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: Copyright © section9-lab
        # openauth issuer for Google / email-OTP sign-in. Overridable at
        # runtime via the PI_WORK_OPENAUTH_ISSUER_URL env var or the
        # auth.openauth.issuerURL user default.
        OpenAuthIssuerURL: https://auth.vibevibe.cc
        CFBundleURLTypes:
          - CFBundleURLName: cc.vibevibe.pi-work.auth
            CFBundleURLSchemes:
              - pi-work
    entitlements:
      path: PiWork/Resources/PiWork.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.vibevibe.pi-work
        PRODUCT_NAME: PiWork
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.1.9
    postCompileScripts:
      - name: "Stage bundled agent host"
        basedOnDependencyAnalysis: false
        script: |
          set -e

          HOST_SOURCE_ROOT="$SRCROOT/AgentHost"
          HOST_BUN="$(command -v bun || true)"
          if [ -z "$HOST_BUN" ]; then
            echo "error: Bun is required to build the self-contained agent host."
            exit 1
          fi

          if [ ! -d "$HOST_SOURCE_ROOT/node_modules/@earendil-works/pi-coding-agent" ]; then
            echo "Installing Agent Host build dependencies..."
            (cd "$HOST_SOURCE_ROOT" && "$HOST_BUN" install --frozen-lockfile)
          fi

          PI_CODING_AGENT_VERSION="$(
            cd "$HOST_SOURCE_ROOT"
            "$HOST_BUN" -e 'console.log(require("./node_modules/@earendil-works/pi-coding-agent/package.json").version)'
          )"
          if [ -z "$PI_CODING_AGENT_VERSION" ]; then
            echo "error: pi-coding-agent version is missing."
            exit 1
          fi
          HOST_VERSION_DESTINATION="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/AgentHost/pi-coding-agent-version"
          mkdir -p "$(dirname "$HOST_VERSION_DESTINATION")"
          printf '%s\n' "$PI_CODING_AGENT_VERSION" > "$HOST_VERSION_DESTINATION"

          HOST_BUILD_ROOT="$DERIVED_FILE_DIR/PiWorkAgentHost"
          mkdir -p "$HOST_BUILD_ROOT"

          for HOST_ARCH in $ARCHS; do
            case "$HOST_ARCH" in
              arm64)
                HOST_TARGET="bun-darwin-arm64"
                HOST_FOLDER="arm64"
                ;;
              x86_64)
                HOST_TARGET="bun-darwin-x64"
                HOST_FOLDER="x64"
                ;;
              *)
                echo "error: unsupported Agent Host architecture $HOST_ARCH"
                exit 1
                ;;
            esac

            HOST_OUTPUT="$HOST_BUILD_ROOT/pi-work-agent-host-$HOST_ARCH"
            (cd "$HOST_SOURCE_ROOT" && "$HOST_BUN" build --compile --no-compile-autoload-bunfig --target="$HOST_TARGET" src/main.ts --outfile "$HOST_OUTPUT")
            chmod +x "$HOST_OUTPUT"

            HOST_DESTINATION_DIR="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/AgentHost/$HOST_FOLDER"
            HOST_DESTINATION="$HOST_DESTINATION_DIR/pi-work-agent-host"
            mkdir -p "$HOST_DESTINATION_DIR"
            cp "$HOST_OUTPUT" "$HOST_DESTINATION"
            chmod +x "$HOST_DESTINATION"

            HOST_EXPORT_ASSETS_SOURCE="$HOST_SOURCE_ROOT/node_modules/@earendil-works/pi-coding-agent/dist/core/export-html"
            HOST_EXPORT_ASSETS_DESTINATION="$HOST_DESTINATION_DIR/export-html"
            if [ ! -d "$HOST_EXPORT_ASSETS_SOURCE" ]; then
              echo "error: pi-coding-agent HTML export assets are missing."
              exit 1
            fi
            mkdir -p "$HOST_EXPORT_ASSETS_DESTINATION"
            cp -R "$HOST_EXPORT_ASSETS_SOURCE/." "$HOST_EXPORT_ASSETS_DESTINATION"

            HOST_THEME_ASSETS_SOURCE="$HOST_SOURCE_ROOT/node_modules/@earendil-works/pi-coding-agent/dist/modes/interactive/theme"
            HOST_THEME_ASSETS_DESTINATION="$HOST_DESTINATION_DIR/theme"
            if [ ! -d "$HOST_THEME_ASSETS_SOURCE" ]; then
              echo "error: pi-coding-agent theme assets are missing."
              exit 1
            fi
            mkdir -p "$HOST_THEME_ASSETS_DESTINATION"
            cp -R "$HOST_THEME_ASSETS_SOURCE/." "$HOST_THEME_ASSETS_DESTINATION"

            if [ "$CODE_SIGNING_ALLOWED" != "NO" ]; then
              HOST_SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
              if [ "$ENABLE_HARDENED_RUNTIME" = "YES" ]; then
                /usr/bin/codesign --force --preserve-metadata=entitlements --options runtime --timestamp --sign "$HOST_SIGN_IDENTITY" "$HOST_DESTINATION"
              else
                /usr/bin/codesign --force --sign "$HOST_SIGN_IDENTITY" "$HOST_DESTINATION"
              fi
            else
              # Bun emits a linker signature that is invalid after compilation.
              # A nested executable still needs a valid ad-hoc signature even
              # when Xcode signing is disabled for local builds and tests.
              /usr/bin/codesign --force --sign - "$HOST_DESTINATION"
            fi

            echo "Staged self-contained Agent Host ($HOST_FOLDER) into Contents/Helpers."
          done

      - name: "Stage bundled Bun package manager"
        basedOnDependencyAnalysis: false
        script: |
          set -e

          BUN_VERSION="1.3.14"
          for BUN_ARCH in $ARCHS; do
            case "$BUN_ARCH" in
              arm64) BUN_FOLDER="arm64" ;;
              x86_64) BUN_FOLDER="x64" ;;
              *)
                echo "error: unsupported Bun architecture $BUN_ARCH"
                exit 1
                ;;
            esac

            BUN_SOURCE="$SRCROOT/build/Bun/$BUN_FOLDER/bun"
            if [ ! -x "$BUN_SOURCE" ]; then
              BUN_ARCHS="$BUN_FOLDER" "$SRCROOT/scripts/fetch-bun-binary.sh" "$BUN_VERSION"
            fi

            BUN_DESTINATION_DIR="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/Bun/$BUN_FOLDER"
            BUN_DESTINATION="$BUN_DESTINATION_DIR/bun"
            mkdir -p "$BUN_DESTINATION_DIR"
            cp "$BUN_SOURCE" "$BUN_DESTINATION"
            chmod +x "$BUN_DESTINATION"

            if [ "$CODE_SIGNING_ALLOWED" != "NO" ]; then
              BUN_SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
              if [ "$ENABLE_HARDENED_RUNTIME" = "YES" ]; then
                /usr/bin/codesign --force --preserve-metadata=entitlements --options runtime --timestamp --sign "$BUN_SIGN_IDENTITY" "$BUN_DESTINATION"
              else
                /usr/bin/codesign --force --preserve-metadata=entitlements --sign "$BUN_SIGN_IDENTITY" "$BUN_DESTINATION"
              fi
            else
              /usr/bin/codesign --force --preserve-metadata=entitlements --sign - "$BUN_DESTINATION"
            fi

            echo "Staged Bun package manager ($BUN_FOLDER) into Contents/Helpers."
          done

  PiWorkTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: PiWorkTests
    dependencies:
      - target: PiWork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.vibevibe.pi-work.tests
        PRODUCT_NAME: PiWorkTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PiWork.app/Contents/MacOS/PiWork"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  PiWork:
    build:
      targets:
        PiWork: all
        PiWorkTests: [test]
    test:
      targets:
        - PiWorkTests
    run:
      config: Debug
